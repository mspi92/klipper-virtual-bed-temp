# Add to moonraker.conf to get updates in Mainsail/Fluidd.
# Replace <github-user> with the account hosting the repository.
[update_manager klipper-virtual-bed-temp]
type: git_repo
path: ~/klipper-virtual-bed-temp
origin: https://github.com/<github-user>/klipper-virtual-bed-temp.git
primary_branch: main
managed_services: klipper
install_script: install.sh
