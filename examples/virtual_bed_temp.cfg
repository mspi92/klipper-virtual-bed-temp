# Estimated build-plate temperature, driven by [heater_bed].
# Calibrate time_constant/loss with tools/fit_tau.py (see README).
[virtual_bed_temp]
heater: heater_bed
time_constant: 300
#loss: 0
#ambient_temp: 22

# In PRINT_START, after the bed heater reached its own target:
#
#   M190 S{bed}
#   WAIT_VIRTUAL_BED_TEMP MARGIN=2
#
# MARGIN: °C below the plate's steady state that counts as soaked.
